server:
  port: 8080

spring:
  ai:
    mcp:
      server:
        name: youtube-mcp-server
        version: 0.1.0
        # STREAMABLE = modern streamable-HTTP transport (recommended), SSE also supported.
        protocol: STREAMABLE
        # Set to true instead if you want this to run as a STDIO server (e.g. launched by
        # a desktop MCP client) rather than as a standalone HTTP service.
        stdio: false

youtube:
  api:
    key: ${YOUTUBE_API_KEY}
    base-url: https://www.googleapis.com/youtube/v3

logging:
  level:
    com.dev.turkim.youtubemcp: DEBUG
